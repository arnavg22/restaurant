<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer - Cafeteria Green</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/customer.css">
</head>
<body>
    <header>
        <h1>Cafeteria Green</h1>
        <nav>
            <a href="#" id="logout">Logout</a>
        </nav>
    </header>
    <main>
        <section id="menu">
            <h2>Menu</h2>
            <div id="menu-items"></div>
        </section>
        <section id="cart">
            <h2>Cart</h2>
            <div id="cart-items"></div>
            <p>Total: <span id="cart-total">0.00</span></p>
            <form id="order-form">
                <h3>Delivery Details</h3>
                <div class="form-group">
                    <label for="delivery-name">Name</label>
                    <input type="text" id="delivery-name" required>
                </div>
                <div class="form-group">
                    <label for="delivery-phone">Phone</label>
                    <input type="text" id="delivery-phone" required>
                </div>
                <div class="form-group">
                    <label for="building-name">Building Name</label>
                    <input type="text" id="building-name" required>
                </div>
                <div class="form-group">
                    <label for="floor-seat">Floor/Seat</label>
                    <input type="text" id="floor-seat" required>
                </div>
                <div class="form-group">
                    <label for="delivery-notes">Notes</label>
                    <textarea id="delivery-notes"></textarea>
                </div>
                <h3>Payment</h3>
                <div class="form-group">
                    <label for="transaction-id">Transaction ID</label>
                    <input type="text" id="transaction-id" required>
                </div>
                <button type="submit">Place Order</button>
            </form>
        </section>
    </main>
    <script src="js/customer.js"></script>
</body>
</html>
