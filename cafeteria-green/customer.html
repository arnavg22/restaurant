<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cafeteria Green — Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cg.css">
<style>
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.06);position:relative}
.screen{display:none;flex-direction:column;min-height:100vh}
.screen.active{display:flex}
.topbar{background:var(--leaf);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .brand b{font-family:'Bricolage Grotesque';font-size:17px}
.topbar .brand small{display:block;font-size:11px;opacity:.85}
.iconbtn{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;position:relative;color:#fff}
.iconbtn svg{width:22px;height:22px}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--amber);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--leaf)}
.back-btn{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;font-size:15px}
.back-btn svg{width:20px;height:20px}
.body{flex:1;padding:14px 16px 130px;overflow-y:auto}
.searchwrap{position:sticky;top:62px;background:var(--bg);padding:10px 16px;z-index:15;border-bottom:1px solid var(--line-soft)}
.searchwrap input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);padding:0 16px;font-size:14px;background:var(--panel)}
.cat-head{padding:16px 0 6px;border-left:3px solid var(--leaf);padding-left:12px;margin-top:8px}
.cat-head h3{font-size:17px}
.item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.item-main{flex:1;min-width:0}
.item-name{font-weight:600;font-size:15px}
.item-desc{font-size:12.5px;color:var(--ink-faint);margin-top:3px}
.item-price{font-weight:700;font-size:14px;margin-top:6px}
.add-btn{width:40px;height:40px;border-radius:12px;background:var(--leaf-bg);color:var(--leaf-deep);font-size:22px;font-weight:700;border:1px solid oklch(0.88 0.05 150)}
.stepper{display:flex;align-items:center;background:var(--leaf);border-radius:12px;height:40px;overflow:hidden}
.stepper button{width:34px;height:40px;color:#fff;font-size:19px;font-weight:700}
.stepper span{min-width:24px;text-align:center;color:#fff;font-weight:700}
.cartbar{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);bottom:18px;width:calc(100% - 32px);max-width:408px;background:var(--leaf-deep);color:#fff;border-radius:16px;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 30px rgba(0,0,0,.22);z-index:30;transition:transform .35s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.cartbar.show{transform:translateX(-50%) translateY(0)}
.cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft);align-items:center}
.bill{background:var(--panel-2);border-radius:16px;padding:18px;margin-top:16px}
.bill-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--ink-soft)}
.bill-row.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;font-size:18px;font-weight:700;color:var(--ink)}
.section-title{font-size:15px;font-weight:700;margin:20px 0 10px}
.deal-pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.deal-chip{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;cursor:pointer;flex:1;min-width:140px}
.deal-chip.sel{border-color:var(--leaf);background:var(--leaf-bg)}
.deal-chip b{display:block;font-size:13px}
.qr-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center;margin-bottom:16px}
.qr-box img{width:240px;height:240px;max-width:100%}
.qr-amt{font-family:'Bricolage Grotesque';font-size:30px;font-weight:800;color:var(--leaf-deep)}
.qr-vpa{font-size:13px;color:var(--ink-soft);margin-top:4px}
.upi-link{display:inline-flex;margin-top:12px}
.pay-steps{font-size:13px;color:var(--ink-soft);line-height:1.7;background:var(--panel-2);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.pay-steps b{color:var(--ink)}
.order-id{font-family:'Bricolage Grotesque';font-size:34px;font-weight:800;color:var(--leaf-deep);text-align:center}
.order-sub{text-align:center;color:var(--ink-faint);font-size:13px;margin-top:2px;margin-bottom:8px}
.progress{margin:22px 0}
.pstep{display:flex;gap:14px}
.pstep .dotcol{display:flex;flex-direction:column;align-items:center}
.pdot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-faint);z-index:2;transition:all .3s}
.pline{width:2px;flex:1;background:var(--line);min-height:24px}
.pstep:last-child .pline{display:none}
.pstep.done .pdot{background:var(--leaf);border-color:var(--leaf);color:#fff}
.pstep.done .pline{background:var(--leaf)}
.pstep.cur .pdot{background:var(--leaf);border-color:var(--leaf);color:#fff;box-shadow:0 0 0 5px var(--leaf-bg)}
.pstep .ptxt{padding-bottom:18px}
.pstep .ptxt b{font-size:15px}
.pstep.pending .ptxt b{color:var(--ink-faint);font-weight:500}
.pstep .ptxt small{display:block;color:var(--ink-faint);font-size:12.5px}
.celebrate{background:var(--leaf);color:#fff;border-radius:16px;padding:18px;text-align:center;margin:16px 0;display:none}
.celebrate.show{display:block;animation:fadeSlideUp .4s ease}
.cancel-banner{background:oklch(0.95 0.04 25);color:var(--hot);border-radius:14px;padding:16px;text-align:center;margin:16px 0;font-weight:600;display:none}
.cancel-banner.show{display:block}
.linkbtn{color:var(--leaf-deep);font-weight:600;font-size:14px;text-align:center;padding:14px;width:100%}
.logout{font-size:12px;color:rgba(255,255,255,.85);cursor:pointer}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- LOGIN / REGISTER -->
  <div class="login-wrap screen active" id="screen-auth">
    <div class="login-card">
      <div class="lm"><svg viewBox="0 0 24 24" fill="none"><path d="M5 14c0-6 8-9 14-9 0 8-5 13-11 13-3 0-3-4-3-4z" fill="#fff"/></svg></div>
      <h1 id="authTitle">Welcome back</h1>
      <div class="role-tag">Cafeteria Green · Order food to your desk</div>
      <div class="login-err" id="authErr"></div>
      <div id="loginForm">
        <div class="field"><label>Email</label><input id="liEmail" type="email" placeholder="you@office.com"></div>
        <div class="field"><label>Password</label><input id="liPass" type="password" placeholder="••••••••"></div>
        <button class="btn block" id="loginBtn" onclick="doLogin()">Log in</button>
        <div class="login-alt">New here? <a onclick="showRegister()">Create an account</a></div>
      </div>
      <div id="registerForm" class="hidden">
        <div class="field"><label>Full name</label><input id="rgName" placeholder="Your name"></div>
        <div class="field"><label>Email</label><input id="rgEmail" type="email" placeholder="you@office.com"></div>
        <div class="field"><label>Phone</label><input id="rgPhone" inputmode="tel" placeholder="10-digit mobile"></div>
        <div class="field"><label>Password</label><input id="rgPass" type="password" placeholder="min 6 characters"></div>
        <button class="btn block" id="regBtn" onclick="doRegister()">Create account &amp; start</button>
        <div class="login-alt">Already have an account? <a onclick="showLogin()">Log in</a></div>
      </div>
    </div>
  </div>

  <!-- MENU -->
  <div class="screen" id="screen-menu">
    <div class="topbar">
      <div class="brand">
        <svg class="leaf-svg" viewBox="0 0 24 24" fill="none"><path d="M5 14c0-6 8-9 14-9 0 8-5 13-11 13-3 0-3-4-3-4z" fill="#fff"/></svg>
        <div><b>Cafeteria Green</b><small id="menuHello">Delivery</small></div>
      </div>
      <button class="iconbtn" onclick="go('cart')">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="#fff"/><circle cx="18" cy="20" r="1.4" fill="#fff"/></svg>
        <span class="badge" id="cartBadge" style="display:none">0</span>
      </button>
    </div>
    <div class="searchwrap"><input id="search" placeholder="Search dishes…" oninput="renderMenu()"></div>
    <div class="body" id="menuBody"><div class="empty">Loading menu…</div></div>
  </div>

  <!-- CART + DELIVERY -->
  <div class="screen" id="screen-cart">
    <div class="topbar"><button class="back-btn" onclick="go('menu')"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>Your order</button><div style="width:20px"></div></div>
    <div class="body" id="cartBody"></div>
  </div>

  <!-- PAYMENT -->
  <div class="screen" id="screen-pay">
    <div class="topbar"><button class="back-btn" onclick="go('cart')"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>Pay &amp; confirm</button><div style="width:20px"></div></div>
    <div class="body" id="payBody"></div>
  </div>

  <!-- TRACK -->
  <div class="screen" id="screen-track">
    <div class="topbar"><div class="brand"><svg class="leaf-svg" viewBox="0 0 24 24" fill="none"><path d="M5 14c0-6 8-9 14-9 0 8-5 13-11 13-3 0-3-4-3-4z" fill="#fff"/></svg><b>Order status</b></div><span class="logout" onclick="logout()">Log out</span></div>
    <div class="body" id="trackBody"></div>
  </div>

  <div class="cartbar" id="cartbar" onclick="go('cart')">
    <div><div style="font-size:13px;opacity:.85" id="cbCount">0 items</div><div style="font-weight:700;font-size:16px" id="cbTotal">₹0</div></div>
    <div style="font-weight:700;display:flex;align-items:center;gap:6px">View order →</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="cg-api.js"></script>
<script>
const { CGApi, rupee, toast, STATUS_LABEL } = CG;
const api = CGApi('customer');
let MENU = [], CART = {}, DEALS = [], selectedDeal = null;
let currentOrderId = null, pollTimer = null, socket = null;
const $ = s => document.querySelector(s);

function go(screen){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $('#screen-'+screen).classList.add('active'); window.scrollTo(0,0); updateCartBar(screen); }

/* ---------- AUTH ---------- */
function showRegister(){ $('#loginForm').classList.add('hidden'); $('#registerForm').classList.remove('hidden'); $('#authTitle').textContent='Create account'; hideErr(); }
function showLogin(){ $('#registerForm').classList.add('hidden'); $('#loginForm').classList.remove('hidden'); $('#authTitle').textContent='Welcome back'; hideErr(); }
function showErr(m){ const e=$('#authErr'); e.textContent=m; e.classList.add('show'); }
function hideErr(){ $('#authErr').classList.remove('show'); }
async function doLogin(){
  hideErr(); const btn=$('#loginBtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  try{ await api.login($('#liEmail').value.trim(), $('#liPass').value); await enterApp(); }
  catch(e){ showErr(e.message); } finally{ btn.disabled=false; btn.textContent='Log in'; }
}
async function doRegister(){
  hideErr(); const btn=$('#regBtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  try{
    await api.register({ name:$('#rgName').value.trim(), email:$('#rgEmail').value.trim(), phone:$('#rgPhone').value.trim(), password:$('#rgPass').value });
    await enterApp();
  }catch(e){ showErr(e.message); } finally{ btn.disabled=false; btn.textContent='Create account & start'; }
}
function logout(){ if(socket) socket.disconnect(); clearInterval(pollTimer); api.logout(); location.reload(); }

async function enterApp(){
  $('#menuHello').textContent = 'Hi ' + (api.user?.name?.split(' ')[0] || 'there') + ' · Delivery';
  await loadMenu();
  loadDeals();
  go('menu');
}

/* ---------- MENU ---------- */
async function loadMenu(){
  try{ MENU = await api.get('/menu'); renderMenu(); }
  catch(e){ $('#menuBody').innerHTML = `<div class="empty">Couldn't load menu: ${e.message}</div>`; }
}
async function loadDeals(){ try{ DEALS = await api.get('/orders/deals'); }catch{ DEALS=[]; } }

function renderMenu(){
  const q = $('#search').value.trim().toLowerCase();
  const cats = {};
  MENU.filter(it=>!q || it.name.toLowerCase().includes(q)).forEach(it=>{ (cats[it.category]=cats[it.category]||[]).push(it); });
  const keys = Object.keys(cats);
  if(!keys.length){ $('#menuBody').innerHTML='<div class="empty">No dishes found.</div>'; return; }
  let html='';
  keys.forEach(cat=>{
    html += `<div class="cat-head"><h3>${cat}</h3></div>`;
    cats[cat].forEach(it=>{
      html += `<div class="item"><div class="item-main"><div class="item-name">${it.name}</div>
        ${it.description?`<div class="item-desc">${it.description}</div>`:''}
        <div class="item-price">${rupee(it.price)}</div></div><div id="add-${it.id}"></div></div>`;
    });
  });
  $('#menuBody').innerHTML = html;
  Object.values(cats).flat().forEach(it=>renderAdd(it.id));
}
function renderAdd(id){
  const slot=document.getElementById('add-'+id); if(!slot) return;
  const qty = CART[id]?.qty || 0;
  slot.innerHTML = qty>0
    ? `<div class="stepper"><button onclick="chg('${id}',-1)">−</button><span>${qty}</span><button onclick="chg('${id}',1)">+</button></div>`
    : `<button class="add-btn" onclick="chg('${id}',1)">+</button>`;
}
function chg(id, d){
  const it = MENU.find(m=>m.id===id); if(!it) return;
  if(!CART[id]) CART[id]={item:it, qty:0};
  CART[id].qty += d;
  if(CART[id].qty<=0) delete CART[id];
  renderAdd(id); updateCartBar('menu');
}
function cartItems(){ return Object.values(CART); }
function cartCount(){ return cartItems().reduce((s,c)=>s+c.qty,0); }
function cartSubtotal(){ return cartItems().reduce((s,c)=>s+c.item.price*c.qty,0); }
function updateCartBar(screen){
  const n=cartCount();
  const badge=$('#cartBadge'); badge.style.display=n?'flex':'none'; badge.textContent=n;
  $('#cartbar').classList.toggle('show', n>0 && screen==='menu');
  $('#cbCount').textContent = n+' item'+(n!==1?'s':''); $('#cbTotal').textContent = rupee(cartSubtotal());
}

/* ---------- CART + DELIVERY ---------- */
function renderCart(){
  const arr=cartItems();
  if(!arr.length){ $('#cartBody').innerHTML=`<div class="empty">Your cart is empty.<br><br><button class="btn ghost" onclick="go('menu')">Browse menu</button></div>`; return; }
  let html='';
  arr.forEach(c=>{
    html += `<div class="cart-item"><div style="flex:1"><div class="item-name">${c.item.name}</div><div class="item-price">${rupee(c.item.price)}</div></div>
      <div class="stepper"><button onclick="chg('${c.item.id}',-1);renderCart()">−</button><span>${c.qty}</span><button onclick="chg('${c.item.id}',1);renderCart()">+</button></div></div>`;
  });
  const sub=cartSubtotal();
  const disc = selectedDeal ? estimateDiscount(selectedDeal, sub) : 0;
  // deals
  let dealHtml='';
  const usable = DEALS.filter(d=>sub>=d.minOrderAmount);
  if(usable.length){
    dealHtml = `<div class="section-title">Offers</div><div class="deal-pick">` +
      usable.map(d=>`<div class="deal-chip ${selectedDeal&&selectedDeal.id===d.id?'sel':''}" onclick="pickDeal('${d.id}')"><b>${d.title}</b><span class="muted">${d.description||''}</span></div>`).join('') +
      (selectedDeal?`<div class="deal-chip" onclick="pickDeal(null)"><b>Remove offer</b></div>`:'') + `</div>`;
  }
  html += dealHtml;
  html += `<div class="section-title">Delivery details</div>
    <div class="field"><label>Receiver name *</label><input id="dName" value="${api.user?.name||''}" placeholder="Who receives this"></div>
    <div class="field"><label>Phone *</label><input id="dPhone" inputmode="tel" value="${api.user?.phone||''}" placeholder="10-digit mobile"></div>
    <div class="field"><label>Office / building *</label><input id="dBuilding" placeholder="e.g. Tech Park Tower A"></div>
    <div class="field"><label>Floor / desk / seat *</label><input id="dFloor" placeholder="e.g. 3rd Floor, Desk 42"></div>
    <div class="field"><label>Notes (optional)</label><textarea id="dNotes" placeholder="e.g. call on arrival, near reception"></textarea></div>`;
  html += `<div class="bill"><div class="bill-row"><span>Item total</span><span>${rupee(sub)}</span></div>
    ${disc>0?`<div class="bill-row" style="color:var(--leaf-deep)"><span>Offer discount</span><span>−${rupee(disc)}</span></div>`:''}
    <div class="bill-row total"><span>To pay</span><span>${rupee(sub-disc)}</span></div></div>
    <div style="margin-top:16px"><button class="btn block" onclick="goToPayment()">Continue to payment →</button></div>`;
  $('#cartBody').innerHTML = html;
  // restore delivery values
  if(savedDelivery){ ['dName','dPhone','dBuilding','dFloor','dNotes'].forEach(k=>{ if(savedDelivery[k]!=null) $('#'+k).value=savedDelivery[k]; }); }
}
let savedDelivery = null;
function pickDeal(id){ selectedDeal = id ? DEALS.find(d=>d.id===id) : null; renderCart(); }
function estimateDiscount(deal, sub){
  let d = deal.discountType==='flat' ? deal.discountValue : sub*deal.discountValue/100;
  if(deal.discountType==='percent' && deal.maxDiscountAmount) d=Math.min(d, deal.maxDiscountAmount);
  return Math.min(d, sub*0.15); // platform cap (mirrors backend)
}
function collectDelivery(){
  savedDelivery = { dName:$('#dName').value, dPhone:$('#dPhone').value, dBuilding:$('#dBuilding').value, dFloor:$('#dFloor').value, dNotes:$('#dNotes').value };
  return { deliveryName:$('#dName').value.trim(), deliveryPhone:$('#dPhone').value.trim(), buildingName:$('#dBuilding').value.trim(), floorSeat:$('#dFloor').value.trim(), deliveryNotes:$('#dNotes').value.trim() };
}

/* ---------- PAYMENT ---------- */
async function goToPayment(){
  const delivery = collectDelivery();
  if(!delivery.deliveryName||!delivery.deliveryPhone||!delivery.buildingName||!delivery.floorSeat){ toast('Please fill all delivery fields'); return; }
  // validate delivery with backend first
  try{ await api.post('/orders/validate-delivery', { delivery }); }
  catch(e){ toast(e.message.replace(/\n/g,' ')); return; }
  pendingDelivery = delivery;
  go('pay');
  $('#payBody').innerHTML = `<div class="empty">Generating secure UPI QR…</div>`;
  try{
    const payload = { items: cartItems().map(c=>({menuItemId:c.item.id, quantity:c.qty})) };
    if(selectedDeal) payload.dealCode = selectedDeal.id;
    const qr = await api.post('/orders/payment-qr', payload);
    renderPayment(qr);
  }catch(e){ $('#payBody').innerHTML = `<div class="empty">Couldn't generate QR: ${e.message}<br><br><button class="btn ghost" onclick="go('cart')">Back</button></div>`; }
}
let pendingDelivery = null, pendingQR = null;
function renderPayment(qr){
  pendingQR = qr;
  $('#payBody').innerHTML = `
    <div class="qr-box">
      <img src="${qr.qr}" alt="UPI QR code">
      <div class="qr-amt">${rupee(qr.amount)}</div>
      <div class="qr-vpa">Pay to <b>${qr.payeeVpa}</b> · ${qr.payeeName}</div>
      <a class="btn soft upi-link" href="${qr.upiUri}">Open in UPI app</a>
    </div>
    <div class="pay-steps"><b>How to pay</b><br>1. Scan the QR with any UPI app (GPay / PhonePe / Paytm).<br>2. The amount <b>${rupee(qr.amount)}</b> is prefilled — just confirm.<br>3. Copy the <b>UPI transaction ID</b> from your app and paste it below.</div>
    <div class="field"><label>UPI Transaction ID *</label><input id="txnId" placeholder="e.g. 4198XXXXXXXX"></div>
    <button class="btn block" id="placeBtn" onclick="placeOrder()">I've paid — place order</button>
    <div class="muted" style="font-size:12px;text-align:center;margin-top:10px">Your order reaches the kitchen only after the counter verifies this transaction ID.</div>`;
}
async function placeOrder(){
  const transactionId = $('#txnId').value.trim();
  if(!transactionId){ toast('Enter the UPI transaction ID'); return; }
  const btn=$('#placeBtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  try{
    const payload = { items: cartItems().map(c=>({menuItemId:c.item.id, quantity:c.qty})), delivery: pendingDelivery, transactionId };
    if(selectedDeal) payload.dealCode = selectedDeal.id;
    const order = await api.post('/orders', payload);
    currentOrderId = order.id;
    CART={}; selectedDeal=null; savedDelivery=null;
    startTracking();
    go('track');
    toast('Order placed! Awaiting payment verification.');
  }catch(e){ toast(e.message.replace(/\n/g,' ')); btn.disabled=false; btn.textContent="I've paid — place order"; }
}

/* ---------- TRACK ---------- */
const FLOW = [
  ['payment_verification_pending','Order placed','Awaiting payment verification by counter'],
  ['accepted','Payment verified','Order accepted'],
  ['preparing','In the kitchen','Your food is being prepared'],
  ['ready','Ready','Packed and ready for pickup'],
  ['out_for_delivery','Out for delivery','On the way to you'],
  ['delivered','Delivered','Enjoy your meal!'],
];
function startTracking(){
  renderTrack(); clearInterval(pollTimer); pollTimer=setInterval(renderTrack, 5000);
  if(socket){ socket.emit('subscribe:order', currentOrderId); }
}
async function renderTrack(){
  if(!currentOrderId) return;
  let order;
  try{ order = await api.get('/orders/'+currentOrderId); }catch{ return; }
  const cancelled = order.status==='cancelled' || order.status==='payment_expired';
  const curIdx = FLOW.findIndex(f=>f[0]===order.status);
  const itemsLine = order.items.reduce((s,i)=>s+i.quantity,0);
  let html = `<div class="order-id">#${order.orderNumber}</div>
    <div class="order-sub">${itemsLine} items · ${rupee(order.financials.customerPays)} · ${order.delivery.building}</div>`;
  if(order.status==='delivered'){ html += `<div class="celebrate show"><div style="font-size:26px">✓</div><b>Delivered — enjoy your meal!</b></div>`; }
  if(cancelled){ html += `<div class="cancel-banner show">This order was ${STATUS_LABEL[order.status].toLowerCase()}.</div>`; }
  if(!cancelled){
    html += `<div class="progress">` + FLOW.map((f,i)=>{
      const cls = i<curIdx?'done':i===curIdx?'cur':'pending';
      return `<div class="pstep ${cls}"><div class="dotcol"><div class="pdot">${i<curIdx?'✓':i+1}</div><div class="pline"></div></div>
        <div class="ptxt"><b>${f[1]}</b><small>${i===curIdx?f[2]:''}</small></div></div>`;
    }).join('') + `</div>`;
  }
  html += `<div class="bill">${order.items.map(i=>`<div class="bill-row"><span>${i.quantity}× ${i.name}</span><span>${rupee(i.total)}</span></div>`).join('')}
    ${order.financials.discountAmount>0?`<div class="bill-row" style="color:var(--leaf-deep)"><span>Offer</span><span>−${rupee(order.financials.discountAmount)}</span></div>`:''}
    <div class="bill-row total"><span>Paid</span><span>${rupee(order.financials.customerPays)}</span></div></div>
    <div class="muted" style="font-size:12px;text-align:center;margin-top:10px">Txn ID submitted · Delivery to ${order.delivery.floorSeat}</div>
    <button class="linkbtn" onclick="newOrder()">← Place another order</button>`;
  $('#trackBody').innerHTML = html;
}
function newOrder(){ clearInterval(pollTimer); currentOrderId=null; go('menu'); }

/* ---------- INIT ---------- */
function connectRealtime(){
  socket = api.connectSocket({
    'order:status_changed': (d)=>{ if(d.orderId===currentOrderId){ renderTrack(); toast(d.message||'Order updated'); } },
    'order:cancelled': (d)=>{ if(d.orderId===currentOrderId){ renderTrack(); toast(d.message||'Order cancelled'); } },
  });
}
(async function init(){
  if(api.isAuthed()){
    try{ await api.get('/auth/me'); connectRealtime(); await enterApp(); }
    catch{ api.logout(); }
  }
})();
// hook the screen helper into cart/payment renders
const _go = go;
go = function(s){ _go(s); if(s==='cart') renderCart(); if(s==='menu' && !socket && api.isAuthed()) connectRealtime(); };
</script>
</body>
