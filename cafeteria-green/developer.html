<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cafeteria Green — Developer Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cg.css">
<style>
.dheader{background:linear-gradient(100deg,var(--slate),var(--slate-2));color:#fff;padding:16px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.dh-left{display:flex;align-items:center;gap:12px}
.dh-left .ic{width:40px;height:40px;border-radius:11px;background:var(--leaf);display:flex;align-items:center;justify-content:center}
.dh-left b{font-family:'Bricolage Grotesque';font-size:17px;display:block}
.dh-left small{font-size:11px;opacity:.7}
.dh-right{display:flex;align-items:center;gap:16px;font-size:12.5px}
.dh-right .clock{font-family:'Bricolage Grotesque';font-size:16px;font-weight:700}
.dh-right .logout{background:rgba(255,255,255,.14);border-radius:8px;padding:7px 12px;color:#fff;font-weight:600;font-size:12px}
.wrap{padding:24px 26px 60px;max-width:1500px;margin:0 auto}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tabs button{height:38px;padding:0 16px;border-radius:10px;background:var(--panel-2);color:var(--ink-soft);font-weight:600;font-size:13.5px}
.tabs button.sel{background:var(--slate);color:#fff}
.view{display:none}.view.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:600}
.kpi .v{font-family:'Bricolage Grotesque';font-size:26px;font-weight:800;margin-top:5px}
.kpi.platform{background:linear-gradient(135deg,var(--slate),var(--slate-2));border-color:transparent;color:#fff}
.kpi.platform .l{color:rgba(255,255,255,.65)}.kpi.platform .v{color:var(--citrus)}
.kpi.rev .v{color:var(--leaf-deep)}.kpi.owed .v{color:var(--bean)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}
.card h3{font-size:16px;margin-bottom:14px}
.barrow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.barrow .bl{width:160px;font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .bt{flex:1;height:20px;background:var(--panel-2);border-radius:6px;overflow:hidden}
.barrow .bf{height:100%;background:var(--leaf);border-radius:6px}
.barrow .bv{width:60px;text-align:right;font-weight:700;font-size:13px}
.logwrap{overflow-x:auto}
table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);border-bottom:2px solid var(--line);white-space:nowrap}
table.log td{padding:9px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
.deal{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.deal.off{opacity:.55}
.deal-h{display:flex;justify-content:space-between;align-items:flex-start}
.deal b{font-size:14.5px}.deal .meta{font-size:12.5px;color:var(--ink-faint);margin-top:3px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dealform{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.dealform .full{grid-column:1/-1}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login">
  <div class="login-card">
    <div class="lm" style="background:var(--slate)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1>Developer Console</h1><div class="role-tag">Cafeteria Green · Platform analytics</div>
    <div class="login-err" id="err"></div>
    <div class="field"><label>Email</label><input id="email" type="email" value="dev@cafeteriagrean.in"></div>
    <div class="field"><label>Password</label><input id="pass" type="password" placeholder="••••••••"></div>
    <button class="btn block dark" id="loginBtn" onclick="doLogin()">Log in</button>
    <div class="login-hint">Demo: <b>dev@cafeteriagrean.in</b> · password <b>CafeGreen@2026</b></div>
  </div>
</div>

<!-- APP -->
<div class="hidden" id="app">
  <div class="dheader">
    <div class="dh-left"><div class="ic"><svg class="leaf-svg" viewBox="0 0 24 24" fill="none"><path d="M5 14c0-6 8-9 14-9 0 8-5 13-11 13-3 0-3-4-3-4z" fill="#fff"/></svg></div><div><b>Cafeteria Green</b><small>Developer Console</small></div></div>
    <div class="dh-right"><span class="clock" id="clock">--:--</span><span id="who">Platform Admin</span><button class="logout" onclick="logout()">Log out</button></div>
  </div>
  <div class="wrap">
    <div class="tabs" id="tabs">
      <button data-view="overview" class="sel">Overview</button>
      <button data-view="orders">Order Log</button>
      <button data-view="deals">Deals</button>
    </div>

    <div class="view active" id="view-overview">
      <div class="kpis" id="kpis"></div>
      <div class="grid2">
        <div class="card"><h3>Top items by revenue</h3><div id="topItems"></div></div>
        <div class="card"><h3>Period summary</h3><div id="periodSummary"></div></div>
      </div>
    </div>

    <div class="view" id="view-orders">
      <div class="card"><div class="section-head"><h3>Full Order Log</h3><button class="btn sm dark" onclick="exportCSV()">⬇ Export CSV</button></div>
        <div class="logwrap"><table class="log" id="logTable"></table></div></div>
    </div>

    <div class="view" id="view-deals">
      <div class="card"><h3>Create deal <span class="muted" style="font-weight:400;font-size:12px">(discount comes from your 15% share)</span></h3>
        <div class="dealform">
          <div class="field full"><label>Title</label><input id="dlTitle" placeholder="e.g. ₹40 off above ₹250"></div>
          <div class="field"><label>Type</label><select id="dlType"><option value="flat">Flat ₹</option><option value="percent">Percent %</option></select></div>
          <div class="field"><label>Value</label><input id="dlValue" type="number" placeholder="40 or 10"></div>
          <div class="field"><label>Min order ₹</label><input id="dlMin" type="number" value="0"></div>
          <div class="field"><label>Max discount ₹ (percent only)</label><input id="dlMax" type="number" placeholder="optional"></div>
          <div class="field"><label>Expires</label><input id="dlExp" type="date"></div>
          <div class="field"><label>Max uses / user</label><input id="dlPerUser" type="number" value="1"></div>
        </div>
        <button class="btn" onclick="createDeal()">Create deal</button>
      </div>
      <div style="margin-top:18px" id="dealList"></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="cg-api.js"></script>
<script>
const { CGApi, rupee, toast, STATUS_LABEL } = CG;
const api = CGApi('developer');
const $ = s=>document.querySelector(s);
let ORDERS=[], pollTimer=null, socket=null, currentView='overview';

function doLogin(){
  const btn=$('#loginBtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  api.login($('#email').value.trim(), $('#pass').value)
    .then(()=>enterApp())
    .catch(e=>{ const el=$('#err'); el.textContent=e.message; el.classList.add('show'); btn.disabled=false; btn.textContent='Log in'; });
}
function logout(){ if(socket)socket.disconnect(); clearInterval(pollTimer); api.logout(); location.reload(); }

function enterApp(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').textContent = api.user?.name || 'Platform Admin';
  setInterval(()=>{ $('#clock').textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}); },1000);
  socket = api.connectSocket({ 'order:new': ()=>refresh(), 'order:status_changed': ()=>refresh() });
  refresh();
  pollTimer=setInterval(refresh, 6000);
}
$('#tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b)return; currentView=b.dataset.view;
  $('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('#view-'+currentView).classList.add('active');
  if(currentView==='deals') loadDeals();
});

async function refresh(){
  try{
    const [dash, ordersResp] = await Promise.all([ api.get('/dev/dashboard'), api.get('/dev/orders?limit=200') ]);
    ORDERS = ordersResp.orders;
    renderOverview(dash);
    renderLog();
  }catch(e){ /* ignore transient */ }
}

function renderOverview(d){
  $('#kpis').innerHTML = `
    <div class="kpi"><div class="l">Orders (all time)</div><div class="v">${d.periodStats.totalOrders}</div></div>
    <div class="kpi rev"><div class="l">Gross Revenue</div><div class="v">${rupee(d.periodStats.grossRevenue)}</div></div>
    <div class="kpi platform"><div class="l">Platform Earnings (15%)</div><div class="v">${rupee(d.periodStats.platformEarnings)}</div></div>
    <div class="kpi owed"><div class="l">Outstanding Commission</div><div class="v">${rupee(d.unsettled.outstandingCommission)}</div></div>
    <div class="kpi"><div class="l">Active Orders</div><div class="v">${d.activeOrders}</div></div>`;
  const items=d.topItems||[]; const max=Math.max(1,...items.map(i=>i.revenue));
  $('#topItems').innerHTML = items.length? items.map(i=>`<div class="barrow"><div class="bl">${i.name}</div><div class="bt"><div class="bf" style="width:${i.revenue/max*100}%"></div></div><div class="bv">${rupee(i.revenue)}</div></div>`).join('') : '<div class="muted">No delivered orders yet.</div>';
  $('#periodSummary').innerHTML = `
    <div class="barrow"><div class="bl">Customer revenue</div><div class="bv" style="width:auto;flex:1;text-align:right">${rupee(d.periodStats.customerRevenue)}</div></div>
    <div class="barrow"><div class="bl">Restaurant payout (85%)</div><div class="bv" style="width:auto;flex:1;text-align:right">${rupee(d.periodStats.restaurantPayout)}</div></div>
    <div class="barrow"><div class="bl">Platform earnings (15%)</div><div class="bv" style="width:auto;flex:1;text-align:right">${rupee(d.periodStats.platformEarnings)}</div></div>
    <div class="barrow"><div class="bl">Avg order value</div><div class="bv" style="width:auto;flex:1;text-align:right">${rupee(d.periodStats.averageOrderValue)}</div></div>
    <div class="barrow"><div class="bl">Delivered today</div><div class="bv" style="width:auto;flex:1;text-align:right">${d.today.orders} · ${rupee(d.today.revenue)}</div></div>`;
}

function renderLog(){
  let html='<tr><th>Order</th><th>Customer</th><th>Status</th><th>Items</th><th>Subtotal</th><th>Discount</th><th>Customer Pays</th><th>Platform 15%</th><th>Txn ID</th></tr>';
  html += ORDERS.map(o=>`<tr><td><b>#${o.orderNumber}</b></td><td>${o.customer.name}</td>
    <td><span class="sbadge s-${o.status}">${STATUS_LABEL[o.status]||o.status}</span></td>
    <td>${o.items.reduce((s,i)=>s+i.qty,0)}</td><td>${rupee(o.financials.subtotal)}</td><td>${rupee(o.financials.discountAmount)}</td>
    <td><b>${rupee(o.financials.customerPays)}</b></td><td style="color:var(--leaf-deep);font-weight:700">${rupee(o.financials.platformEarnings)}</td>
    <td style="font-size:11px">${o.payment.transactionId||'—'}${o.payment.verified?' ✓':''}</td></tr>`).join('');
  $('#logTable').innerHTML = html;
}
function exportCSV(){
  const rows=[['Order','Customer','Status','Items','Subtotal','Discount','CustomerPays','PlatformEarnings','RestaurantShare','TxnID','Verified']];
  ORDERS.forEach(o=>rows.push([o.orderNumber,o.customer.name,o.status,o.items.reduce((s,i)=>s+i.qty,0),o.financials.subtotal,o.financials.discountAmount,o.financials.customerPays,o.financials.platformEarnings,o.financials.restaurantShare,o.payment.transactionId||'',o.payment.verified]));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='cafeteria-green-orders.csv'; a.click(); URL.revokeObjectURL(url); toast('CSV exported');
}

async function loadDeals(){
  try{
    const deals = await api.get('/dev/deals');
    $('#dealList').innerHTML = deals.length? deals.map(d=>`
      <div class="deal ${d.isActive?'':'off'}"><div class="deal-h"><div>
        <b>${d.title}</b><div class="meta">${d.discountType==='flat'?rupee(d.discountValue)+' off':d.discountValue+'% off'}${d.maxDiscountAmount?' (max '+rupee(d.maxDiscountAmount)+')':''} · min ${rupee(d.minOrderAmount)} · used ${d.totalUsages||0}×</div>
        <div class="meta">Expires ${new Date(d.expiresAt).toLocaleDateString('en-IN')}</div></div>
        ${d.isActive?`<button class="btn sm danger" onclick="deactivate('${d.id}')">Deactivate</button>`:'<span class="sbadge s-cancelled">Inactive</span>'}
      </div></div>`).join('') : '<div class="muted card">No deals yet.</div>';
  }catch(e){ $('#dealList').innerHTML='<div class="empty">'+e.message+'</div>'; }
}
async function createDeal(){
  const title=$('#dlTitle').value.trim(), discountType=$('#dlType').value, discountValue=parseFloat($('#dlValue').value);
  const minOrderAmount=parseFloat($('#dlMin').value)||0, maxDiscountAmount=$('#dlMax').value?parseFloat($('#dlMax').value):null;
  const exp=$('#dlExp').value, maxUsesPerUser=parseInt($('#dlPerUser').value)||1;
  if(!title||!discountValue||!exp){ toast('Fill title, value and expiry'); return; }
  try{
    await api.post('/dev/deals',{ title, discountType, discountValue, minOrderAmount, maxDiscountAmount, maxUsesPerUser, expiresAt:new Date(exp+'T23:59:59').toISOString() });
    toast('Deal created'); $('#dlTitle').value=''; $('#dlValue').value=''; loadDeals();
  }catch(e){ toast(e.message); }
}
async function deactivate(id){ try{ await api.patch('/dev/deals/'+id+'/deactivate'); toast('Deactivated'); loadDeals(); }catch(e){ toast(e.message); } }

if(api.isAuthed()){ api.get('/auth/me').then(()=>enterApp()).catch(()=>api.logout()); }
</script>
</body>
</html>
