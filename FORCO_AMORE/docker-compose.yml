services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: forco_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: forco_amore
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forco_user -d forco_amore"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3089"
    command: sh -c "npx prisma migrate deploy && node src/server.js"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./forco_amore:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
